<style>
/* Layout: a single dark screening room. Video stage centred, controls docked beneath, drawer slides over from the right. */
:root {
  --bg: #050B0C; --panel: #0D1A1C; --panel2: #132426; --ink: #EEE7D7; --ink2: #AEB8B1; --ink3: #6F7F7C;
  --rule: rgba(238,231,215,0.14); --accent: #E8B44A; --focus: #5FC0D2;
  --display: "Instrument Serif", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "IBM Plex Sans", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#app { min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 10px 18px; box-sizing: border-box; }
.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; width: 100%; max-width: var(--stageW, 1400px); margin: 0 auto 10px; }
.brand { font-family: var(--display); font-size: 27px; letter-spacing: 0.2px; }
.sub { color: var(--ink3); font-size: 12px; letter-spacing: 2.2px; text-transform: uppercase; font-weight: 600; }
.top .spacer { flex: 1; }
.top button { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; color: var(--ink2); font-size: 13px; }
.top button:hover, .top .toplink:hover { color: var(--ink); border-color: var(--ink3); }
.top .toplink { border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; color: var(--ink2); font-size: 13px; text-decoration: none; }
#wrap { width: 100%; max-width: var(--stageW, 1400px); margin: 0 auto; display: flex; flex-direction: column; gap: 0; }
#stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0B1618; overflow: hidden; border-radius: 4px 4px 0 0; box-shadow: 0 30px 80px rgba(0,0,0,0.55); }
#cv { display: block; width: 100%; height: 100%; }
#cap { position: absolute; left: 50%; bottom: 3.4%; transform: translateX(-50%); max-width: 82%; width: max-content; text-align: center; font-weight: 500; font-size: var(--capSize, 18px); line-height: 1.3; color: #F4EEDF; background: rgba(5,11,12,0.8); padding: 0.32em 0.8em 0.38em; border-radius: 0.25em; pointer-events: none; text-wrap: balance; }
#cap:empty, #cap.off { display: none; }
#bigPlay { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; display: flex; align-items: center; gap: 14px; background: rgba(8,17,18,0.78); border: 1px solid rgba(238,231,215,0.25); border-radius: 999px; padding: 14px 26px 14px 18px; font-size: 17px; font-weight: 500; letter-spacing: 0.3px; backdrop-filter: blur(4px); transition: transform .15s ease, background .15s ease; }
#bigPlay:hover { transform: scale(1.03); background: rgba(14,30,32,0.9); }
#bigPlay .disc { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #121A1B; }
#bigPlay small { display: block; color: var(--ink3); font-size: 12.5px; font-weight: 400; }
#controls { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 0 0 4px 4px; padding: 8px 10px; flex-wrap: wrap; }
.ib { background: none; border: 0; width: 38px; height: 38px; border-radius: 6px; display: grid; place-items: center; color: var(--ink2); flex: none; }
.ib:hover { background: var(--panel2); color: var(--ink); }
.ib svg { width: 20px; height: 20px; }
.ib[aria-pressed="true"] { color: var(--accent); }
#time { font: 13px var(--mono); color: var(--ink2); min-width: 104px; text-align: center; font-variant-numeric: tabular-nums; flex: none; }
#scrub { position: relative; flex: 1 1 260px; min-width: 160px; height: 38px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
#segs { display: flex; gap: 3px; width: 100%; height: 6px; }
.seg { position: relative; height: 100%; background: rgba(238,231,215,0.16); border-radius: 2px; overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--c, var(--accent)); }
#scrub:hover #segs { height: 9px; }
#knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px rgba(238,231,215,0.12); pointer-events: none; }
#tip { position: absolute; bottom: 40px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; white-space: nowrap; pointer-events: none; color: var(--ink); }
#tip b { font-weight: 600; } #tip span { color: var(--ink3); font-family: var(--mono); margin-left: 8px; }
#rate { background: var(--panel2); border: 1px solid var(--rule); border-radius: 6px; height: 32px; padding: 0 6px; font-size: 13px; color: var(--ink2); flex: none; }
#nowline { display: flex; gap: 10px; align-items: baseline; padding: 12px 2px 0; color: var(--ink2); font-size: 14px; flex-wrap: wrap; }
#nowline .r { font-family: var(--display); font-style: italic; font-size: 22px; }
#nowline .t { font-family: var(--display); font-size: 22px; color: var(--ink); }
#nowline .s { color: var(--ink3); }
.hint { margin-left: auto; color: var(--ink3); font-size: 12px; }
.hint kbd { font: 11px var(--mono); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; color: var(--ink2); }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--rule); z-index: 20; display: flex; flex-direction: column; box-shadow: -30px 0 60px rgba(0,0,0,0.45); }
#drawer header { display: flex; align-items: center; gap: 6px; padding: 14px 14px 10px 18px; border-bottom: 1px solid var(--rule); }
.tab { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--ink3); font-weight: 600; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--panel2); }
#drawer .close { margin-left: auto; }
#drawerBody { overflow-y: auto; padding: 8px 18px 40px; flex: 1; }
.chap { padding: 14px 0 8px; border-bottom: 1px solid var(--rule); }
.chap h3 { margin: 0 0 6px; font: 400 23px var(--display); display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
.chap h3 .rn { font-style: italic; color: var(--c); min-width: 38px; }
.chap h3 .dur { margin-left: auto; font: 12px var(--mono); color: var(--ink3); }
.chap ol { list-style: none; margin: 0; padding: 0 0 0 48px; }
.chap li { padding: 3px 0; color: var(--ink2); cursor: pointer; display: flex; gap: 8px; }
.chap li:hover, .chap h3:hover { color: var(--ink); }
.chap li .tm { margin-left: auto; font: 12px var(--mono); color: var(--ink3); }
.chap.now h3 { color: var(--ink); } .chap li.now { color: var(--accent); }
#lexSearch { width: 100%; box-sizing: border-box; margin: 12px 0 6px; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 9px 12px; }
.term { padding: 12px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.term .no { font: 11.5px var(--mono); color: var(--c); letter-spacing: 1px; }
.term .nm { font: 400 21px var(--display); margin: 2px 0 3px; color: var(--ink); }
.term .df { color: var(--ink2); font-size: 14px; }
.term .ch { color: var(--ink3); font-size: 12px; margin-top: 4px; }
.term:hover .nm { color: var(--accent); }
#resume { position: absolute; top: 14px; right: 14px; background: rgba(8,17,18,0.85); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--ink2); }
:fullscreen #app, :-webkit-full-screen #app { padding: 0; }
:fullscreen .top, :fullscreen #nowline { display: none; }
:fullscreen #wrap { max-width: none; height: 100vh; justify-content: center; }
:fullscreen #stage { width: min(100vw, calc((100vh - 54px) * 16 / 9)); margin: 0 auto; border-radius: 0; }
:fullscreen #controls { width: min(100vw, calc((100vh - 54px) * 16 / 9)); margin: 0 auto; border-radius: 0; }
body.render #app { padding: 0; } body.render .top, body.render #controls, body.render #nowline, body.render #bigPlay, body.render #cap { display: none !important; }
body.render #wrap { max-width: none; width: 1920px; } body.render #stage { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
@media (max-width: 640px) {
  .sub, .hint, #btnPrev, #btnNext { display: none; }
  #time { min-width: 0; font-size: 12px; }
  #scrub { order: 10; flex-basis: 100%; }
  #bigPlay { padding: 10px 16px 10px 12px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { #bigPlay { transition: none; } }
</style>
